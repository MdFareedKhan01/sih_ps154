# Host ports default to 5432 and 6379. If a PostgreSQL or Redis already runs on your machine,
# set PG_PORT / REDIS_PORT in .env and change the port in DATABASE_URL / REDIS_URL to match.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ps154
      POSTGRES_PASSWORD: ps154dev
      POSTGRES_DB: ps154
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
volumes:
  pg_data:
  redis_data:
